name: Update Yuki Clock

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-clock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Calculate Live Time
        run: |
          export TZ="America/New_York"
          echo "LIVE_TIME=$(date +'%I:%M %p on %m/%d/%y')" >> $GITHUB_ENV

      - name: Safely Overwrite Time Block
        run: |
          # This cuts out the old text and replaces it directly
          sed -i '/### 🕒 Current Time & Day/,$!b; /---/!d; r' command-center.md
          sed -i "/### 🕒 Current Time & Day/a \` $LIVE_TIME \`\n" command-center.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add command-center.md
          git commit -m "🤖 Yuki Bot: Live clock refresh" || exit 0
          git push
