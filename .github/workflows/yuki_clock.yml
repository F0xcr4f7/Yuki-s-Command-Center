name: Update Yuki Clock

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-clock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Calculate Live Time and Update File
        run: |
          python3 -c "
          from datetime import datetime
          import zoneinfo

          # Calculate current time in New York timezone
          tz = zoneinfo.ZoneInfo('America/New_York')
          now = datetime.now(tz)
          live_time = now.strftime('%I:%M %p on %m/%d/%y')

          # Read the file
          with open('command-center.md', 'r') as f:
              lines = f.readlines()

          # Find the time section and update the line right underneath it
          for i, line in enumerate(lines):
              if '### 🕒 Current Time & Day' in line:
                  lines[i+1] = f'\` {live_time} \`\n'
                  break

          # Write changes back to the file
          with open('command-center.md', 'w') as f:
              f.writelines(lines)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add command-center.md
          git commit -m "🤖 Yuki Bot: Live clock refresh" || exit 0
          git push
