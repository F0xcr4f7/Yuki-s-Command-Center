name: Update Yuki Clock

on:
  schedule:
    - cron: '*/5 * * * *' # Updates every 5 minutes
  workflow_dispatch: # Lets you click run manually

jobs:
  update-clock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Calculate Live Time
        run: |
          export TZ="America/New_York"
          echo "LIVE_TIME=$(date +'%I:%M %p on %m/%d/%y')" >> $GITHUB_ENV

      - name: Overwrite Time Block
        run: |
          # This completely rewrites the top section safely every single time
          sed -i '/### 🕒 Current Time & Day/,/---/{/### 🕒 Current Time & Day/!{/---/!d}}' command-center.md
          sed -i '/### 🕒 Current Time & Day/a \` '"$LIVE_TIME"' \` ' command-center.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Yuki Clock Bot"
          git config --global user.email "bot@github.com"
          git add command-center.md
          git commit -m "🤖 Yuki Bot: Updated live dashboard clock" || exit 0
          git push
